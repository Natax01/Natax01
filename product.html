<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جزئیات محصول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body class="font-[Vazirmatn] bg-gray-100 text-gray-900">
  <!-- Navbar -->
  <nav class="bg-white shadow">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <a href="Index.html" class="text-xl font-bold">فروشگاه</a>
      <ul class="flex space-x-4 space-x-reverse">
        <li><a href="products.html" class="hover:text-blue-600">محصولات</a></li>
        <li><a href="cart.html" class="hover:text-blue-600 flex items-center"><span>سبد خرید</span> <span id="cart-count" class="ml-1 text-sm bg-blue-600 text-white rounded-full px-2"></span></a></li>
      </ul>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8">
    <div id="product-container" class="bg-white p-6 rounded shadow flex flex-col md:flex-row gap-8"></div>
  </main>

  <script src="assets/js/app.js"></script>
  <script>
    async function loadProduct() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = Number(urlParams.get('id')) || 0;
      const res = await fetch('assets/data/products.json');
      const products = await res.json();
      const product = products.find(p => p.id === id);
      if (!product) {
        document.getElementById('product-container').innerHTML = '<p>محصول یافت نشد</p>';
        return;
      }
      const container = document.getElementById('product-container');
      container.innerHTML = `
        <img src="${product.image}" alt="${product.name}" class="w-full md:w-1/3 rounded" />
        <div class="flex-1">
          <h1 class="text-2xl font-bold mb-4">${product.name}</h1>
          <p class="mb-4">${product.description}</p>
          <p class="text-xl font-semibold mb-6">${product.price.toLocaleString('fa-IR')} تومان</p>
          <button id="add-btn" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700">افزودن به سبد</button>
        </div>
      `;
      document.getElementById('add-btn').addEventListener('click', () => {
        addToCart(product);
        alert('محصول به سبد اضافه شد');
      });
    }
    loadProduct();
    updateCartCount();
  </script>
</body>
</html>
